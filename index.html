<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <meta name="description" content="Renewable energy engineering portfolio — simulations, system design and analysis.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='7' fill='%23f5a524'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="nav">
    <div class="wrap nav-inner">
      <a href="#top" class="brand" id="brand"></a>
      <nav class="nav-links">
        <a href="#projects">Projects</a>
        <a href="#skills">Skills</a>
        <a href="#experience">Experience</a>
        <a href="#contact">Contact</a>
      </nav>
      <button class="theme-btn" id="themeBtn" aria-label="Toggle dark mode">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main id="top">
    <!-- HERO -->
    <section class="hero">
      <div class="wrap hero-grid">
        <div>
          <p class="eyebrow" id="role"></p>
          <h1 id="name"></h1>
          <p class="lead" id="tagline"></p>
          <div class="cta">
            <a class="btn primary" href="#projects">View projects</a>
            <a class="btn" id="cvBtn" target="_blank" rel="noopener">Download CV</a>
          </div>
          <div class="stats" id="stats"></div>
        </div>
        <div class="hero-art" aria-hidden="true">
          <svg viewBox="0 0 400 400">
            <defs>
              <radialGradient id="sunG" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ffd27a"/><stop offset="100%" stop-color="#f5a524"/>
              </radialGradient>
            </defs>
            <circle class="ring r1" cx="200" cy="200" r="150"/>
            <circle class="ring r2" cx="200" cy="200" r="110"/>
            <circle cx="200" cy="200" r="58" fill="url(#sunG)"/>
            <g class="orbit"><circle cx="350" cy="200" r="9" fill="var(--accent)"/></g>
            <g class="orbit slow"><circle cx="200" cy="90" r="6" fill="var(--sky)"/></g>
            <g class="turbine" transform="translate(320 300)">
              <line x1="0" y1="0" x2="0" y2="80" stroke="var(--ink-2)" stroke-width="4" stroke-linecap="round"/>
              <g class="blades">
                <path d="M0 0 L-4 -46 L0 -50 L4 -46 Z" fill="var(--ink-2)"/>
                <path d="M0 0 L-4 -46 L0 -50 L4 -46 Z" fill="var(--ink-2)" transform="rotate(120)"/>
                <path d="M0 0 L-4 -46 L0 -50 L4 -46 Z" fill="var(--ink-2)" transform="rotate(240)"/>
              </g>
              <circle r="5" fill="var(--ink-2)"/>
            </g>
          </svg>
        </div>
      </div>
    </section>

    <!-- ABOUT -->
    <section class="section" id="about">
      <div class="wrap about-grid">
        <div class="avatar" id="avatar"></div>
        <div>
          <h2>About</h2>
          <div id="aboutText"></div>
        </div>
      </div>
    </section>

    <!-- PROJECTS -->
    <section class="section alt" id="projects">
      <div class="wrap">
        <div class="section-head">
          <h2>Projects</h2>
          <div class="filters" id="filters"></div>
        </div>
        <div class="grid" id="projectGrid"></div>
      </div>
    </section>

    <!-- SKILLS -->
    <section class="section" id="skills">
      <div class="wrap">
        <h2>Skills &amp; tools</h2>
        <div class="skills" id="skillsBox"></div>
      </div>
    </section>

    <!-- EXPERIENCE -->
    <section class="section alt" id="experience">
      <div class="wrap">
        <h2>Experience &amp; education</h2>
        <ol class="timeline" id="timeline"></ol>
      </div>
    </section>

    <!-- CONTACT -->
    <section class="section contact" id="contact">
      <div class="wrap">
        <h2>Let's work together</h2>
        <p class="lead">Open to internships, graduate roles and research in solar, storage, hydrogen and power systems.</p>
        <div class="cta center" id="contactLinks"></div>
      </div>
    </section>
  </main>

  <footer class="footer"><div class="wrap" id="footer"></div></footer>

  <!-- Project detail popup -->
  <dialog id="modal">
    <button class="close" id="closeModal" aria-label="Close">&times;</button>
    <div id="modalBody"></div>
  </dialog>

  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
